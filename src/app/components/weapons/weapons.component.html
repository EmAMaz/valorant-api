
<div class="container-fluid container__main-home position-relative min-vh-100">
    <div class="container d-flex align-items-center justify-content-between border-bottom border-1" style="padding: 8em 0 0.5em 0;">
        <app-navbar></app-navbar>
        <form class="d-flex">
            <input class="form-control me-sm-2" type="text" placeholder="Search..." [(ngModel)]="filterPost" name="filterPost">
        </form>
    </div>
    <div class="container text-center">
        <div class="row" style="padding: 3em;">
            <div class="col-4 pt-3 border border-0 bg_card" *ngFor="let item of data | filter:filterPost">
                    <div class="card_edit p-3">
                        <img src={{item.displayIcon}} alt="...">
                        <div class="card-body">
                            <h5 class="card-title">{{item.displayName}}</h5>
                            <p class="card-text">{{item.description}}</p>
                        </div>
                    </div>
                    <div class="card-footer">
                    </div>
            </div>
        </div>
    </div>
</div>
